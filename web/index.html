<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf spots</title>
<link rel="stylesheet" href="css/spot.css">
<style>
.spots{list-style:none;margin:8px 0 0;padding:0}
.spots li+li{border-top:1px solid var(--line)}
.spots a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;color:var(--text);text-decoration:none}
.spots a:hover .nm{color:var(--deep)}
.spots .nm{font-weight:600}
.spots .now{text-align:right;white-space:nowrap}
.spots .ft{font-weight:600;font-size:17px}
.spots .what{display:block;color:var(--muted);font-size:13px}
.spots .left{min-width:0}
.updated{margin:14px 0 0;color:var(--muted);font-size:12px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 0}
</style>
</head>
<body>
<main>
<div class="card">
  <h1>Surf spots</h1>
  <p class="sub">Swell, surf height and a 7-day forecast, from a wave model of each spot's real seafloor.</p>
  <div id="list"><p class="status">Loading…</p></div>
</div>
</main>
<script src="config.js"></script>
<script src="js/data.js"></script>
<script>
const KIND={beach:"Beach break",reef:"Reef break",point:"Point break",jetty:"Jetty"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PEEL={slow:"slow",makeable:"makeable",fast:"fast",closeout:"closing out"};
const root=`${SURF.dataRoot}/${SURF.api}/spots/`;
function now(c){                                     // "4–5 ft" and a short line about the swell
  if(!c)return"";
  const bits=[c.main?`${c.main}`:"",c.peel?`${PEEL[c.peel.cls]} ${c.peel.side}s`:c.favors==="peaks"?"peaky":c.favors?`favors ${c.favors}`:""].filter(Boolean);
  return`<span class="now"><span class="ft">${c.surf_ft[0]}–${c.surf_ft[1]} ft</span><span class="what">${esc(bits.join(" · "))}</span></span>`;
}
const ago=t=>{const m=Math.round((Date.now()-Date.parse(t))/60000);return m<2?"just now":m<90?`${m} min ago`:`${Math.round(m/60)} h ago`};
Promise.all([getJSON(root+"index.json"),getJSON(root+"conditions.json",true).catch(()=>null)]).then(([d,c])=>{
  const cond=Object.fromEntries((c?.spots||[]).map(x=>[x.slug,x]));
  const regions={};
  for(const s of d.spots)(regions[s.region_name]??=[]).push(s);
  const newest=(c?.spots||[]).map(x=>x.buoy_time).filter(Boolean).sort().pop();
  document.getElementById("list").innerHTML=Object.entries(regions).map(([r,ss])=>
    `<h2>${esc(r)}</h2><ul class="spots">${ss.map(s=>
      `<li><a href="spot.html?spot=${encodeURIComponent(s.slug)}"><span class="left"><span class="nm">${esc(s.name)}</span><span class="what">${esc(KIND[s.break_type]||"")}</span></span>${now(cond[s.slug])}</a></li>`).join("")}</ul>`).join("")
    +(newest?`<p class="updated">Buoy readings from ${ago(newest)}.</p>`:"");
}).catch(e=>{document.getElementById("list").innerHTML=`<p class="status">Couldn't load the spot list: ${esc(e.message)}.</p>`});
</script>
</body>
</html>
