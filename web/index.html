<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/spot.css">
</head>
<body>
<nav class="site"><a class="brand" href="./"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="#0b5d7e"/><path d="M4 16c3 0 3-3 6-3s3 3 6 3 3-3 6-3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M4 11c3 0 3-3 6-3s3 3 6 3 3-3 6-3" fill="none" stroke="#7fe0d9" stroke-width="2.2" stroke-linecap="round" opacity=".8"/></svg>Surf model</a></nav>
<main>
<header class="hero home-hero compact" id="hero">
  <div class="kicker">California surf</div>
  <h1>Where's it breaking?</h1>
  <p>Surf height, how each swell wraps in, and a 7-day forecast, from a wave model of every spot's real seafloor.</p>
</header>
<div class="toolbar" id="toolbar">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search spots, areas…" aria-label="Search spots" autocomplete="off" spellcheck="false">
    <button id="qclear" class="qclear" aria-label="Clear search" hidden>×</button>
    <kbd>/</kbd>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Sort">
      <button data-sort="geo">North to south</button><button data-sort="best">Best now</button><button data-sort="size">Biggest</button>
    </div>
    <select id="area" aria-label="Area"></select>
    <div class="chips" id="breaks" role="group" aria-label="Break type"></div>
    <button class="chip good" id="good" aria-pressed="false">Good now</button>
    <span class="count" id="count"></span>
    <div class="seg views" role="group" aria-label="View">
      <button data-view="cards" aria-label="Cards" title="Cards"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg></button><button data-view="list" aria-label="List" title="List"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4" rx="1.2"/><rect x="1" y="6.8" width="14" height="2.4" rx="1.2"/><rect x="1" y="11.6" width="14" height="2.4" rx="1.2"/></svg></button>
    </div>
  </div>
</div>
<div id="list"><p class="status">Loading…</p></div>
<div id="foot"></div>
</main>
<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/surf.js"></script>
<script src="js/home.js"></script>
</body>
</html>
